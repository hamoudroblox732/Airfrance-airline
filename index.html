<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirFrance PTFS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.brand span{color:#3195ff}.card,.hero{background:#101720;border:1px solid #273548;border-radius:18px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#14263d,#0c1118)}h1{margin:8px 0;font-size:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.btn{border:0;border-radius:11px;padding:12px 16px;background:#2588ff;color:white;font-weight:800;cursor:pointer}.btn.alt{background:#1d2938}.btn.red{background:#c93d51}.input,.select{width:100%;padding:12px;border-radius:10px;border:1px solid #2b3a4d;background:#080d13;color:white}.field{margin:0 0 14px}.muted{color:#91a0b3}.pill{display:inline-block;background:#173555;color:#a9d5ff;border-radius:50px;padding:6px 10px;font-size:12px;font-weight:800}.nav{display:flex;gap:9px;flex-wrap:wrap}.err{color:#ff7b89}@media(max-width:600px){.wrap{padding:12px}h1{font-size:29px}.top{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
</head>
<body><div id="app"></div>
<script>
const KEY="AF_PTFS_SINGLE_FILE";const OWNER={username:"Ahmad_roblox2222",id:"AF-OWNER-4827",role:"Owner"};let db=JSON.parse(localStorage.getItem(KEY)||"null")||{employees:[],flights:[],bookings:[],classOpen:{Business:false,First:false},access:{},seq:1001};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const SESSION_KEY="AF_PTFS_SESSION";const sess=()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY)||sessionStorage.getItem("af_session")||"null")}catch(e){localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem("af_session");return null}};const setSess=x=>{localStorage.setItem(SESSION_KEY,JSON.stringify(x));sessionStorage.setItem("af_session",JSON.stringify(x));};const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function page(title,body,showBack=true){app.innerHTML=`<main class="wrap"><div class="top"><div class="brand">AIR<span>FRANCE</span> PTFS</div>${(sess()||localStorage.getItem('af_passenger'))?'<button class="btn red" onclick="logout()">Logout</button>':''}</div>${showBack?'<button class="btn alt" onclick="goBack()">← Back</button>':''}${body}</main>`}function goBack(){const s=sess();if(s&&s.role==="Owner")return owner();if(s)return staff();if(localStorage.getItem("af_passenger"))return passenger();return home()}function home(){page("Portal",`<section class="hero"><span class="pill">PTFS FLIGHT PORTAL</span><h1>AirFrance PTFS</h1><div class="nav"><button class="btn" onclick="passengerLogin()">Passenger Login</button><button class="btn alt" onclick="employeeLogin()">Employee Login</button></div></section>`,false)}function passengerLogin(){page("Passenger Login",`<div class="card"><h1>Passenger</h1><div class="field"><input id="pu" class="input" placeholder="Your Roblox username"></div><button class="btn" onclick="passengerEnter()">Continue</button><p id="msg"></p></div>`)}function passengerEnter(){let u=pu.value.trim();if(!u)return msg.textContent="Enter your Roblox username.",msg.className="err";localStorage.setItem("af_passenger",u);passenger()}function passenger(){if(!localStorage.getItem("af_passenger"))return passengerLogin();page("Passenger Portal",`<section class="hero"><span class="pill">PASSENGER</span><h1>${esc(localStorage.getItem("af_passenger"))}</h1><div class="nav"><button class="btn" onclick="pFlights()">Flights</button><button class="btn alt" onclick="pBookings()">My Booking</button></div></section><div id="content"></div>`,false);pFlights()}function pFlights(){let a=db.flights.filter(f=>f.status!=="Cancelled");content.innerHTML=a.map(f=>`<div class="card"><span class="pill">${esc(f.status)}</span><h2>${esc(f.number)}</h2><p>${esc(f.from)} → ${esc(f.to)}</p><p class="muted">${esc(f.aircraft)}</p><div class="grid">${["Economy","Business","First"].map(c=>{let allowed=c==="Economy"||db.classOpen[c]||(db.access[localStorage.getItem("af_passenger")]||[]).includes(c);return `<div class="card"><b>${c}</b><p>${f.seats[c]} seats</p>${allowed?`<button class="btn" onclick="book('${f.id}','${c}')">Book</button>`:`<span class="pill">Restricted</span>`}</div>`}).join("")}</div></div>`).join("")||'<div class="card">No flights.</div>'}function book(id,c){let u=localStorage.getItem("af_passenger"),f=db.flights.find(x=>x.id===id);if(db.bookings.some(x=>x.flightId===id&&x.passenger===u))return alert("Already booked.");if(f.seats[c]<=0)return alert("No seats available.");f.seats[c]--;db.bookings.push({id:Date.now(),flightId:id,passenger:u,class:c});save();alert("Booking confirmed.");pBookings()}function pBookings(){let u=localStorage.getItem("af_passenger");content.innerHTML=db.bookings.filter(x=>x.passenger===u).map(b=>{let f=db.flights.find(x=>x.id===b.flightId);return `<div class="card"><span class="pill">${b.class}</span><h2>${esc(f?.number)}</h2><p>${esc(f?.from)} → ${esc(f?.to)}</p>${f?.server?`<button class="btn" onclick="location.href='${esc(f.server)}'">Join Roblox Server</button>`:`<p class="muted">Pilot has not added the server link yet.</p>`}</div>`}).join("")||'<div class="card">No bookings.</div>'}function employeeLogin(){page("Employee Login",`<div class="card"><h1>Employee</h1><div class="field"><input id="eu" class="input" placeholder="Roblox username"></div><div class="field"><input id="ei" class="input" placeholder="Employee ID"></div><button class="btn" onclick="employeeEnter()">Login</button><p id="msg"></p></div>`)}function employeeEnter(){let u=eu.value.trim(),i=ei.value.trim();if(u===OWNER.username&&i===OWNER.id){setSess(OWNER);return owner()}let e=db.employees.find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.id===i);if(!e)return msg.textContent="Invalid login.",msg.className="err";setSess(e);staff()}function staff(){let x=sess();page("Staff Dashboard",`<section class="hero"><span class="pill">${esc(x.role)}</span><h1>${esc(x.username)}</h1><p class="muted">${esc(x.id)}</p><div class="nav"><button class="btn" onclick="flights()">Flights</button><button class="btn alt" onclick="hub()">Flight Hub</button>${["Owner","Pilot","Management"].includes(x.role)?'<button class="btn alt" onclick="createFlight()">Create Flight</button>':''}<button class="btn alt" onclick="leaves()">Leave Requests</button></div></section>`,false)}function owner(){page("Owner Dashboard",`<section class="hero"><span class="pill">OWNER</span><h1>Owner</h1><div class="nav"><button class="btn" onclick="identities()">Employee Identities</button><button class="btn alt" onclick="flights()">Flights</button><button class="btn alt" onclick="createFlight()">Create Flight</button><button class="btn alt" onclick="classes()">Class Access</button><button class="btn alt" onclick="leaves()">Leave Requests</button><button class="btn alt" onclick="hub()">Flight Hub</button></div></section><div class="grid"><div class="card"><h2>${db.employees.length}</h2><p class="muted">Employees</p></div><div class="card"><h2>${db.flights.length}</h2><p class="muted">Flights</p></div><div class="card"><h2>${db.bookings.length}</h2><p class="muted">Bookings</p></div></div>`,false)}function identities(){if(!["Owner","Management"].includes(sess()?.role))return staff();page("Employee Identities",`<div class="card"><div class="grid"><input id="en" class="input" placeholder="Roblox Username"><input id="eid" class="input" placeholder="Employee ID"><select id="er" class="select"><option>Pilot</option><option>Co-Pilot</option><option>Cabin Crew</option><option>Ground Crew</option><option>Management</option></select></div><br><button class="btn" onclick="addEmployee()">Create Employee</button></div><div class="card"><h2>Directory</h2>${db.employees.map(e=>`<div class="card"><b>${esc(e.username)}</b><p class="muted">${esc(e.id)} • ${esc(e.role)}</p>${sess().role==="Owner"?`<button class="btn red" onclick="removeEmployee('${esc(e.id)}')">Delete</button>`:""}</div>`).join("")||'<p class="muted">No employees yet.</p>'}</div>`)}function addEmployee(){const username=en.value.trim(),employeeId=eid.value.trim(),role=er.value;if(!username||!employeeId)return alert("Complete all fields.");if(db.employees.some(x=>x.id.toLowerCase()===employeeId.toLowerCase()))return alert("Employee ID already exists.");if(db.employees.some(x=>x.username.toLowerCase()===username.toLowerCase()))return alert("Username already exists.");db.employees.push({username,id:employeeId,role});save();alert("Employee identity saved.");identities()}function removeEmployee(id){if(!confirm("Delete employee?"))return;db.employees=db.employees.filter(x=>x.id!==id);save();identities()}function createFlight(){page("Create Flight",`<div class="card"><div class="grid"><input id="fn" class="input" value="AF-${db.seq}"><input id="fa" class="input" placeholder="Airbus A380"><input id="ff" class="input" placeholder="Departure"><input id="ft" class="input" placeholder="Destination"><input id="fp" class="input" placeholder="Pilot" value="${sess().role==="Pilot"?esc(sess().username):""}"><input id="se" type="number" class="input" value="300" placeholder="Economy seats"><input id="sb" type="number" class="input" value="40" placeholder="Business seats"><input id="sf" type="number" class="input" value="12" placeholder="First seats"><input id="fd" type="datetime-local" class="input"></div><br><button class="btn" onclick="saveFlight()">Create Flight</button></div>`)}function saveFlight(){const number=document.getElementById("fn").value.trim(),aircraft=document.getElementById("fa").value.trim(),from=document.getElementById("ff").value.trim(),to=document.getElementById("ft").value.trim(),pilot=document.getElementById("fp").value.trim(),departure=document.getElementById("fd").value,economy=Number(document.getElementById("se").value)||0,business=Number(document.getElementById("sb").value)||0,first=Number(document.getElementById("sf").value)||0;if(!number||!aircraft||!from||!to||!departure)return alert("Complete all fields.");if(economy+business+first<=0)return alert("Add at least one seat.");if(db.flights.some(x=>x.number.toLowerCase()===number.toLowerCase()))return alert("Flight already exists.");db.flights.push({id:Date.now().toString(),number,aircraft,from,to,pilot,status:"Scheduled",seats:{Economy:economy,Business:business,First:first},departure,server:""});db.seq++;save();flights()}function flights(){let x=sess(),a=db.flights.filter(f=>x.role==="Pilot"?f.pilot===x.username:true);page("Flights",a.map(f=>`<div class="card"><span class="pill">${esc(f.status)}</span><h2>${esc(f.number)}</h2><p>${esc(f.from)} → ${esc(f.to)}</p><p class="muted">${esc(f.aircraft)} • Pilot: ${esc(f.pilot||"—")}</p><p>Economy ${f.seats.Economy} • Business ${f.seats.Business} • First ${f.seats.First}</p><button class="btn" onclick="details('${f.id}')">Manage</button>${x.role==="Owner"?` <button class="btn red" onclick="deleteFlight('${f.id}')">Delete</button>`:""}</div>`).join("")||'<div class="card">No flights.</div>')}function deleteFlight(id){if(!confirm("Delete flight?"))return;db.flights=db.flights.filter(x=>x.id!==id);db.bookings=db.bookings.filter(x=>x.flightId!==id);save();flights()}function details(id){let f=db.flights.find(x=>x.id===id),x=sess();page("Flight Details",`<div class="hero"><span class="pill">${esc(f.status)}</span><h1>${esc(f.number)}</h1><p>${esc(f.from)} → ${esc(f.to)}</p><p class="muted">${esc(f.aircraft)}</p></div><div class="card"><h3>Seat Capacity</h3><p>Economy: ${f.seats.Economy}</p><p>Business: ${f.seats.Business}</p><p>First: ${f.seats.First}</p></div>${["Owner","Management"].includes(x.role)||x.username===f.pilot?`<div class="card"><h3>Operations</h3><select id="fs" class="select">${["Scheduled","Boarding","Delayed","Closed","Cancelled","Departed","In Flight","Landed"].map(v=>`<option ${v===f.status?"selected":""}>${v}</option>`).join("")}</select><br><br><button class="btn" onclick="updateStatus('${id}')">Save Status</button></div>`:""}${x.username===f.pilot?`<div class="card"><h3>Roblox Server Link</h3><input id="sl" class="input" value="${esc(f.server||"")}"><br><br><button class="btn" onclick="saveServer('${id}')">Save Server Link</button></div>`:""}`)}function updateStatus(id){db.flights.find(x=>x.id===id).status=fs.value;save();flights()}function saveServer(id){let v=sl.value.trim();if(v&&!/^https:\/\/(www\.)?roblox\.com\//i.test(v))return alert("Use a Roblox URL.");db.flights.find(x=>x.id===id).server=v;save();details(id)}function classes(){if(sess()?.role!=="Owner")return staff();page("Class Access",`<div class="grid">${["Business","First"].map(c=>`<div class="card"><h2>${c}</h2><p>${db.classOpen[c]?"Open to everyone":"Restricted"}</p><button class="btn" onclick="toggleClass('${c}')">Toggle</button></div>`).join("")}</div><div class="card"><h2>Individual Access</h2><div class="grid"><input id="au" class="input" placeholder="Roblox username"><select id="ac" class="select"><option>Business</option><option>First</option></select></div><br><button class="btn" onclick="grantAccess()">Grant Access</button></div>`)}function toggleClass(c){db.classOpen[c]=!db.classOpen[c];save();classes()}function grantAccess(){let u=au.value.trim();if(!u)return;db.access[u]??=[];if(!db.access[u].includes(ac.value))db.access[u].push(ac.value);save();classes()}function leaves(){page("Leave Requests",`<div class="card"><h2>Leave Requests</h2><p class="muted">Crew leave management is available from the flight operations area.</p></div>`)}function hub(){page("Flight Hub",db.flights.map(f=>`<div class="card"><span class="pill">${esc(f.status)}</span><h2>${esc(f.number)}</h2><p>${esc(f.from)} → ${esc(f.to)}</p><p class="muted">${esc(f.aircraft)}</p><button class="btn" onclick="details('${f.id}')">View Flight</button></div>`).join("")||'<div class="card">No flights.</div>')}function logout(){sessionStorage.removeItem("af_session");localStorage.removeItem(SESSION_KEY);localStorage.removeItem("af_passenger");home()}function init(){try{const raw=localStorage.getItem(SESSION_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.username&&s.id&&s.role){sessionStorage.setItem("af_session",raw);if(s.role==="Owner")return owner();return staff()}}}catch(e){localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem("af_session")}if(localStorage.getItem("af_passenger"))return passenger();home()}init();
</script></body></html>
